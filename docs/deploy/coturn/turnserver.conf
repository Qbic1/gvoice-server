# Minimal coturn config for GVoice WebRTC relay.
# Install on the same VDS:  apt-get install coturn
# Enable the service:        set TURNSERVER_ENABLED=1 in /etc/default/coturn
# Run:                       systemctl enable --now coturn
#
# WHY TURN IS NEEDED: the client mesh is peer-to-peer. STUN alone fails when a
# participant is behind a symmetric NAT / restrictive firewall (common on mobile
# and corporate networks). TURN relays media in those cases. With ≤10 users the
# relayed bandwidth is modest but real — size the VDS uplink accordingly.

# Listening port for STUN/TURN.
listening-port=3478

# Public IP of the VDS. Replace with your server's address (required behind NAT).
external-ip=YOUR_PUBLIC_IP

# Realm — your domain.
realm=voice-room.ru

# ── Authentication ───────────────────────────────────────────
# Long-term credential mechanism. The username/password below MUST match the
# `username` / `credential` in client/src/environments/environment.ts.
lt-cred-mech
user=webrtcuser:PUT_THE_SAME_SECRET_AS_environment.ts

# Restrict relay port range and open it in the firewall (udp).
min-port=49152
max-port=65535

# Hardening.
no-cli
no-tlsv1
no-tlsv1_1
# fingerprint is recommended for WebRTC interop.
fingerprint

# For production prefer time-limited REST credentials over a static user:
#   use-auth-secret
#   static-auth-secret=<shared-secret>
# and have the backend hand short-lived credentials to the client at runtime
# (this also removes the build-time-secret problem — see deployment.md).
